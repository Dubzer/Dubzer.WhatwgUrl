name: 'Pushed'

on:
  push:
    branches:
      - 'master'

jobs:
  build:
    name: 'Build and run tests for ${{ matrix.configuration }}'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        configuration: ['Debug', 'Release']
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: 'actions/checkout@v6'
      - uses: 'actions/setup-dotnet@v5'
        with:
          dotnet-version: |
            8
            10
      - name: 'Run tests'
        run: dotnet test -c ${{ matrix.configuration }} --project ./src/Dubzer.WhatwgUrl.Tests
